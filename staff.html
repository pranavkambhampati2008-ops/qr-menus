<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURUM · Order desk</title><style>
:root{color-scheme:dark;--gold:#c9a84c;--bg:#090806;--panel:#17140e;--muted:#a99c83}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f0e8d5;font:15px system-ui,sans-serif}header{padding:22px 5vw;border-bottom:1px solid #3b3120;display:flex;justify-content:space-between;align-items:center}h1{font:300 30px Georgia;margin:0;color:var(--gold)}main{max-width:1100px;margin:28px auto;padding:0 18px}.panel,.order{background:var(--panel);border:1px solid #3b3120;border-radius:12px;padding:18px;margin-bottom:14px}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #51452e;background:#0e0c08;color:#f0e8d5}button{cursor:pointer;background:#c9a84c;color:#17120a;border:0;font-weight:650}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.order h3{margin:0 0 6px;color:var(--gold)}.items{line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{padding:8px 12px}.status{color:var(--gold);text-transform:uppercase;font-size:12px;letter-spacing:.12em}#orders{margin-top:22px}#error{color:#ff9c8e;white-space:pre-wrap}
</style></head><body><header><h1>AURUM · Order desk</h1><span class="muted">Staff dashboard</span></header><main>
<section class="panel" id="login"><h2>Staff sign in</h2><p class="muted">Use the staff account created in Firebase Authentication.</p><div class="grid"><input id="email" type="email" placeholder="Staff email"><input id="password" type="password" placeholder="Password"></div><p><button id="signIn">Sign in</button></p><div id="error"></div></section>
<section id="desk" hidden><div class="panel"><strong id="who"></strong> <button id="signOut" style="float:right">Sign out</button><p class="muted">Live dine-in orders. Mark each order as accepted, preparing, ready or completed.</p></div><div id="orders" class="grid"></div></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="/firebase-config.js"></script><script>
const err=document.getElementById('error');let db,auth,unsubscribe;
if(!window.FIREBASE_CONFIG||String(window.FIREBASE_CONFIG.apiKey).startsWith('REPLACE'))err.textContent='Firebase web configuration is missing. Complete the setup instructions in README-ORDERING.md.';else{firebase.initializeApp(window.FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();}
document.getElementById('signIn').onclick=async()=>{try{err.textContent='';await auth.signInWithEmailAndPassword(document.getElementById('email').value,document.getElementById('password').value);}catch(e){err.textContent=e.message;}};
document.getElementById('signOut').onclick=()=>auth.signOut();
auth?.onAuthStateChanged(async user=>{if(unsubscribe)unsubscribe();if(!user){document.getElementById('login').hidden=false;document.getElementById('desk').hidden=true;return;}const token=await user.getIdTokenResult(true);if(token.claims.staff!==true){err.textContent='This account is not authorised as restaurant staff.';await auth.signOut();return;}document.getElementById('login').hidden=true;document.getElementById('desk').hidden=false;document.getElementById('who').textContent=user.email;unsubscribe=db.collection('orders').orderBy('createdAt','desc').limit(100).onSnapshot(s=>render(s.docs),e=>err.textContent=e.message);});
function render(docs){const root=document.getElementById('orders');root.innerHTML='';if(!docs.length){root.innerHTML='<p class="muted">No orders yet.</p>';return;}docs.forEach(doc=>{const o=doc.data();const el=document.createElement('article');el.className='order';const title=document.createElement('h3');title.textContent='Table '+o.tableId+' · '+doc.id.slice(0,8);const status=document.createElement('div');status.className='status';status.textContent=o.status+' · '+o.paymentStatus;const items=document.createElement('div');items.className='items';items.textContent=(o.items||[]).map(i=>i.quantity+' × '+i.name+' — ₹'+i.lineTotal).join('\n');const total=document.createElement('p');total.textContent='Total: ₹'+o.total+' · '+o.paymentMethod;const actions=document.createElement('div');actions.className='actions';['accepted','preparing','ready','completed','cancelled'].forEach(next=>{const b=document.createElement('button');b.textContent=next;b.onclick=()=>db.collection('orders').doc(doc.id).update({status:next,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});actions.appendChild(b);});el.append(title,status,items,total,actions);root.appendChild(el);});}
</script></body></html>
