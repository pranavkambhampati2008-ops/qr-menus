<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Menu</title><style>
:root{--accent:#c9a84c;--bg:#090806;--panel:#17140e;--muted:#a99c83}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f0e8d5;font:15px system-ui,sans-serif}header{text-align:center;padding:48px 18px 26px;border-bottom:1px solid #3b3120}header h1{font:italic 42px Georgia;font-weight:300;margin:8px;color:var(--accent)}header p{color:var(--muted);font-size:12px}main{max-width:850px;margin:25px auto;padding:0 16px}.category{font:italic 25px Georgia;color:var(--accent);margin:28px 0 12px}.dish{display:flex;gap:14px;align-items:center;border-bottom:1px solid #30291c;padding:16px 0}.dish img{width:76px;height:76px;object-fit:cover;border-radius:8px}.dishmain{flex:1}.dish h3{font:22px Georgia;font-weight:400;margin:0 0 5px}.desc{font-size:12px;color:var(--muted);line-height:1.5}.price{color:var(--accent);font:22px Georgia;white-space:nowrap}.add{display:block;margin-top:8px;background:var(--accent);color:#17120a;border:0;border-radius:6px;padding:7px 12px;font-weight:700}.sold{font-size:11px;color:#d58d80}.cart{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:var(--accent);color:#17120a;border:0;border-radius:30px;padding:14px 22px;font-weight:800;box-shadow:0 8px 30px #0008}.layer{display:none;position:fixed;inset:0;background:#000b;z-index:9;align-items:end;justify-content:center;padding:12px}.panel{background:#17140e;border:1px solid var(--accent);border-radius:14px;padding:20px;width:min(540px,100%);max-height:85vh;overflow:auto}.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff1a}.qty button{background:var(--accent);border:0;padding:5px 10px}.submit{width:100%;padding:13px;background:var(--accent);border:0;border-radius:7px;font-weight:800;margin-top:12px}.pay{display:flex;gap:10px;flex-wrap:wrap}.pay label{padding:10px;border:1px solid #5b4c2e;border-radius:8px}.msg{color:var(--accent);white-space:pre-wrap;font-size:12px;margin-top:10px}
</style></head><body><header><div id="hotelMeta">RESTAURANT MENU</div><h1 id="hotelName">Loading menu…</h1><p id="tableLabel"></p></header><main id="menu"><p style="color:#a99c83">Loading menu…</p></main><button id="cartButton" class="cart" hidden>Your order · ₹0</button><div id="layer" class="layer"><section class="panel"><div style="display:flex;justify-content:space-between"><h2 style="font:italic 28px Georgia;color:var(--accent);margin:0">Your order</h2><button id="close" style="background:transparent;color:white;border:1px solid #555;border-radius:6px">Close</button></div><div id="lines"></div><p style="display:flex;justify-content:space-between;font-size:20px;color:var(--accent)"><span>Total</span><b id="total">₹0</b></p><div class="pay"><label><input type="radio" name="pay" value="counter" checked> Pay at counter</label><label><input type="radio" name="pay" value="online"> Pay online</label></div><button id="submit" class="submit">Place order</button><div id="msg" class="msg"></div></section></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="/firebase-config.js"></script><script src="/restaurant-menu.js"></script></body></html>
