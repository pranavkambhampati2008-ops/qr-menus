<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURUM · Table QR generator</title><style>
*{box-sizing:border-box}body{margin:0;background:#090806;color:#f0e8d5;font:15px system-ui,sans-serif}header{padding:24px 5vw;border-bottom:1px solid #40351f}h1{font:300 32px Georgia;color:#c9a84c;margin:0}main{max-width:1000px;margin:32px auto;padding:0 18px}.panel{border:1px solid #40351f;background:#15120c;border-radius:14px;padding:22px}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:grid;gap:6px;color:#b9aa8e;font-size:12px}input{padding:12px;border-radius:8px;border:1px solid #5c4c2b;background:#090806;color:#fff;font:inherit;width:130px}button{padding:12px 18px;background:#c9a84c;color:#100d07;border:0;border-radius:8px;font-weight:700;cursor:pointer}.muted{color:#aa9b80;font-size:13px;line-height:1.6}#codes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:22px}.qr-card{background:#f4f0e6;color:#17130c;border-radius:12px;padding:16px;text-align:center}.qr-card h3{margin:0 0 12px;font:italic 23px Georgia}.qr-image{background:white;width:160px;height:160px;margin:0 auto 12px;display:grid;place-items:center}.qr-image img{max-width:160px}.qr-card a{display:inline-block;background:#c9a84c;color:#17130c;padding:9px 12px;border-radius:7px;text-decoration:none;font-weight:700;font-size:13px}.url{font-size:10px;word-break:break-all;color:#655a48;margin:8px 0 12px}
</style></head><body><header><h1>AURUM · Table QR generator</h1><p class="muted">Generate a different dine-in ordering QR for every table.</p></header><main><section class="panel"><div class="controls"><label>First table number<input id="start" type="number" min="1" max="99" value="1"></label><label>Last table number<input id="end" type="number" min="1" max="99" value="20"></label><button id="generate">Generate table QRs</button></div><p class="muted">Each QR opens the live menu with its table number attached. Print one QR and place it on the matching table. This generator uses the current domain and restaurant ID <b>aurum-demo</b>.</p><div id="error" class="muted"></div><div id="codes"></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
document.getElementById('generate').onclick=()=>{const start=Number(document.getElementById('start').value),end=Number(document.getElementById('end').value),root=document.getElementById('codes'),err=document.getElementById('error');root.innerHTML='';err.textContent='';if(!Number.isInteger(start)||!Number.isInteger(end)||start<1||end>99||end<start||end-start>49){err.textContent='Choose a valid range from 1 to 99, with no more than 50 tables at once.';return;}for(let n=start;n<=end;n++){const table=String(n).padStart(2,'0'),url=location.origin+'/?table='+table+'&restaurant=aurum-demo',card=document.createElement('article');card.className='qr-card';const title=document.createElement('h3');title.textContent='Table '+table;const image=document.createElement('div');image.className='qr-image';const urlText=document.createElement('div');urlText.className='url';urlText.textContent=url;card.append(title,image,urlText);root.appendChild(card);new QRCode(image,{text:url,width:160,height:160,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});setTimeout(()=>{const img=image.querySelector('img');const canvas=image.querySelector('canvas');const data=img?.src||(canvas?canvas.toDataURL('image/png'):null);if(data){const link=document.createElement('a');link.href=data;link.download='aurum-table-'+table+'-qr.png';link.textContent='Download QR · '+table;card.appendChild(link);}},100);}}
document.getElementById('generate').click();
</script></body></html>
